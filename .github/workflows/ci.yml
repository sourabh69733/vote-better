name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Data worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vote_better
          POSTGRES_USER: vote_better
          POSTGRES_PASSWORD: local_dev_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U vote_better -d vote_better"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: data/package-lock.json
      - run: npm ci
        working-directory: data
      - run: npm run typecheck
        working-directory: data
      - run: npm test
        working-directory: data

  web:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  geo:
    name: PIN lookup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r data/requirements-geo.txt
      - run: python -m unittest data/test/test_build_pin_lookup.py
