services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vote_better
      POSTGRES_USER: vote_better
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - vote_better_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vote_better -d vote_better"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  vote_better_pg:
